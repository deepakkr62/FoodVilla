name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint, build, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript build (backend)
        run: npm run build -w backend

      - name: TypeScript type-check (frontend)
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Unit tests (backend)
        run: npm run test -w backend
        env:
          NODE_ENV: test
          MONGOMS_INSTANCE_START_TIMEOUT: "180000"

      - name: Unit tests (frontend)
        run: npm run test -w frontend

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: e2e

      - name: Build apps
        run: npm run build

      - name: Run E2E tests
        run: npm run e2e
        env:
          CI: "true"
          MONGOMS_INSTANCE_START_TIMEOUT: "180000"

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 14
